name: Publish AbsoluteBalls.net Desktop v0.3.1
# one-time release handoff

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v0.3.1.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download exact production export
        env:
          EXPORT_URL: 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-71ac-81f5-8c62-6970604b0106/raw?se=2026-10-03T01%3A16%3A42Z&sp=r&sv=2026-02-06&sr=b&scid=3509fdc2-1cc3-5bf5-b05e-07d1ce5b33c8&skoid=de71a0d5-fb02-4fce-be69-9296aced242b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-02T20%3A06%3A26Z&ske=2026-10-03T20%3A06%3A26Z&sks=b&skv=2026-02-06&sig=vcc30Wfy5WccprN344oqntU4J/44j2vXjYdeFwShc70%3D'
        run: |
          set -euo pipefail
          curl -fL "$EXPORT_URL" -o export.zip
          unzip -q export.zip -d export
          ls -lah export

      - name: Verify installer hash
        run: |
          set -euo pipefail
          cd export
          expected="6acc7c29f45fc5b8990902c9ec8876cf0440092c651f1d4be9576f758c890973"
          actual="$(sha256sum AbsoluteBalls-Desktop-Setup-0.3.1.exe | awk '{print $1}')"
          echo "Expected: $expected"
          echo "Actual:   $actual"
          test "$actual" = "$expected"
          printf '%s  %s\n' "$actual" "AbsoluteBalls-Desktop-Setup-0.3.1.exe" > AbsoluteBalls-Desktop-Setup-0.3.1.exe.sha256.txt

      - name: Replace public v0.3.1 assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release upload desktop-v0.3.1 export/AbsoluteBalls-Desktop-Setup-0.3.1.exe export/AbsoluteBalls-Desktop-Setup-0.3.1.exe.sha256.txt --clobber --repo "$GH_REPO"
          gh release edit desktop-v0.3.1 --repo "$GH_REPO" --title "AbsoluteBalls.net Desktop v0.3.1" --prerelease --notes "AbsoluteBalls.net Desktop v0.3.1 beta. Player HUD and Replay Sync are app-first, the live HUD keeps Replay Sync usable beside coaching, and the public build is SHA-256 verified. SHA-256: 6acc7c29f45fc5b8990902c9ec8876cf0440092c651f1d4be9576f758c890973"
